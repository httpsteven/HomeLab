services:
  dashboard:
    build: .
    container_name: homelab-dashboard
    restart: unless-stopped

    # Host networking, on purpose.
    #
    # This dashboard normally runs on the same machine as Plex and the *arr
    # stack. On a bridge network, a request to the host's own LAN IP leaves the
    # container, crosses the docker bridge and comes back at the host's LAN
    # interface — where it meets the host firewall like any outside client.
    # Ports you opened for remote access (Plex 32400) get through; everything
    # else is dropped, which HANGS until timeout rather than failing fast.
    # That produces a dashboard where a couple of services work and the rest
    # sit on loading skeletons forever.
    #
    # With host networking the container shares the host's stack, so services
    # are reachable at 127.0.0.1 and the firewall never enters into it.
    #
    # Running the dashboard on a DIFFERENT machine from the services? Delete
    # this line, uncomment the ports block below, and use LAN IPs in
    # .env.local — then make sure the firewall on the services box allows
    # this machine.
    network_mode: host

    # Only needed when NOT using host networking.
    # ports:
    #   - "3000:3000"

    env_file:
      - .env.local
    # Run as the host user that owns ./data.
    #
    # The shorts pipeline (a Python process on the host) and this container BOTH
    # write to data/shorts.db — the pipeline owns the schema and the clip rows,
    # the dashboard writes jobs, review state and the viewer heartbeat. SQLite in
    # WAL mode also creates -wal and -shm files beside it, so both need write
    # access to the DIRECTORY, not just the file.
    #
    # Set these in .env.local (or export them) to your own id: `id -u`, `id -g`.
    # Without this the container runs as uid 1001 and one side or the other gets
    # "attempt to write a readonly database".
    user: "${DASHBOARD_UID:-1001}:${DASHBOARD_GID:-1001}"

    volumes:
      # Growth history and the shorts database — keep this so both survive
      # redeploys.
      - ./data:/app/data

      # Generated clips, read-only.
      #
      # Mounted at the SAME path it has on the host, deliberately: the database
      # stores absolute paths to each .mp4, and the media route resolves them
      # as-is. A different mount point inside the container would make every
      # clip 410 "missing on disk" while the rows look perfectly fine.
      #
      # Change both sides together if your output directory isn't here, and keep
      # them identical. Comment this out if you don't run the shorts pipeline.
      - /srv/shorts_output:/srv/shorts_output:ro

  # Machine metrics: CPU, memory, temperatures, disk I/O, network.
  #
  # Skip this if you already run Glances — just point GLANCES_URL at it.
  #
  # pid: host and network_mode: host are what let Glances see the real machine
  # rather than its own container. Note that host networking does not work on
  # Docker Desktop for Mac or Windows; on those, run Glances natively instead.
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    pid: host
    network_mode: host
    environment:
      - "GLANCES_OPT=-w"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
